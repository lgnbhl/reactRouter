# Verifies the committed JS bundle in inst/reactRouter/ matches a fresh
# build of js/. Catches the case where a contributor edits js/src/ but
# forgets to rebuild the bundle that ships in the R package.
on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "js/**"
      - "inst/reactRouter/**"
      - ".github/workflows/js-build-check.yaml"

name: js-build-check.yaml

permissions: read-all

jobs:
  js-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install JS deps
        working-directory: js
        run: yarn install --frozen-lockfile

      - name: Build bundle
        working-directory: js
        run: yarn build

      - name: Verify committed bundle is up to date
        run: |
          if ! git diff --exit-code -- inst/reactRouter; then
            echo "::error::The bundle in inst/reactRouter/ is out of date."
            echo "Run 'cd js && yarn build' and commit the result."
            exit 1
          fi
